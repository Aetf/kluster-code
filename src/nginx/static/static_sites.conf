ssl_certificate {{ tlsMountPath ~}}/tls.crt;
ssl_certificate_key {{ tlsMountPath ~}}/tls.key;
{{#each sites ~}}
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;

    server_name {{ server_name }};
    root {{ root }};
    location / {}
    {{! Triple-stache: this is nginx config, not HTML -- the default escaping
        would mangle `=`, quotes and `<` into entities and break the server. }}
    {{{ extra }}}
}
{{/each ~}}


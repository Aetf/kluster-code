identity_providers:
  oidc:
    claims_policies:
      # Authelia only puts the standard claims in the ID token; everything the
      # `email`/`profile` scopes grant is served from the userinfo endpoint
      # instead. That is fine for clients that call it, but SplitPro's NextAuth
      # provider sets `idToken: true`, and NextAuth v4 then builds the profile
      # purely out of the ID token claims and never calls userinfo -- so its
      # users end up with a null email, which is the only key it has for
      # matching people to each other.
      splitpro:
        id_token:
          - email
          - email_verified
          # SplitPro seeds the display name from this; without it new users are
          # named after the local part of their email address.
          - name
      # continuwuity reads claims exclusively from the ID token (upstream
      # src/service/oidc/mod.rs) and never calls userinfo, so everything it
      # needs has to be pushed in here: preferred_username becomes the Matrix
      # localpart, name the display name, email the account email.
      matrix:
        id_token:
          - preferred_username
          - name
          - email
    clients:
      - client_name: Immich OAuth Connection
        client_id: {{ env "CONFIG_EXTRA_OIDC_CLIENTS_IMMICH_ID_FILE" | secret | mindent 8 "|" | msquote }}
        client_secret: {{ env "CONFIG_EXTRA_OIDC_CLIENTS_IMMICH_SECRET_FILE" | secret | mindent 8 "|" | msquote }}
        public: false
        authorization_policy: immich
        scopes:
          - openid
          - email
          - profile
        redirect_uris:
          - app.immich:///oauth-callback
          - https://photos.unlimited-code.works/api/oauth/mobile-redirect
          - https://photos.unlimited-code.works/auth/login
          - https://photos.unlimited-code.works/user-settings
        token_endpoint_auth_method: 'client_secret_post'

      - client_name: Jellyfin
        client_id: {{ env "CONFIG_EXTRA_OIDC_CLIENTS_JELLYFIN_ID_FILE" | secret | mindent 8 "|" | msquote }}
        client_secret: {{ env "CONFIG_EXTRA_OIDC_CLIENTS_JELLYFIN_SECRET_FILE" | secret | mindent 8 "|" | msquote }}
        public: false
        authorization_policy: jellyfin
        require_pkce: true
        pkce_challenge_method: 'S256'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_post'
        scopes:
          - openid
          - profile
          - groups
        redirect_uris:
          - https://tube.{{ env "CONFIG_EXTRA_DOMAIN" }}/sso/OID/redirect/Authelia
          - https://tube.lan.ucw.phd/sso/OID/redirect/Authelia
      - client_name: Grafana
        client_id: {{ env "CONFIG_EXTRA_OIDC_CLIENTS_GRAFANA_ID_FILE" | secret | mindent 8 "|" | msquote }}
        client_secret: {{ env "CONFIG_EXTRA_OIDC_CLIENTS_GRAFANA_SECRET_FILE" | secret | mindent 8 "|" | msquote }}
        public: false
        authorization_policy: grafana
        require_pkce: true
        pkce_challenge_method: 'S256'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
        scopes:
          - openid
          - profile
          - groups
          - email
          - offline_access
        grant_types:
          - 'refresh_token'
          - 'authorization_code'
        redirect_uris:
          - https://mon.{{ env "CONFIG_EXTRA_DOMAIN" }}/login/generic_oauth

      - client_name: SplitPro
        client_id: {{ env "CONFIG_EXTRA_OIDC_CLIENTS_SPLITPRO_ID_FILE" | secret | mindent 8 "|" | msquote }}
        client_secret: {{ env "CONFIG_EXTRA_OIDC_CLIENTS_SPLITPRO_SECRET_FILE" | secret | mindent 8 "|" | msquote }}
        public: false
        authorization_policy: splitpro
        claims_policy: 'splitpro'
        # No PKCE, unlike the other clients here: SplitPro builds its NextAuth
        # provider without `checks: ['pkce']` (src/server/auth.ts), and NextAuth
        # v4 only does `state` by default, so it never sends a code_challenge.
        # Requiring it would just break the flow.
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
        scopes:
          - openid
          - profile
          - email
        redirect_uris:
          # NextAuth derives this path from the lowercased OIDC_NAME env var.
          - https://split.{{ env "CONFIG_EXTRA_DOMAIN" }}/api/auth/callback/authelia

      - client_name: Matrix
        client_id: {{ env "CONFIG_EXTRA_OIDC_CLIENTS_MATRIX_ID_FILE" | secret | mindent 8 "|" | msquote }}
        client_secret: {{ env "CONFIG_EXTRA_OIDC_CLIENTS_MATRIX_SECRET_FILE" | secret | mindent 8 "|" | msquote }}
        public: false
        authorization_policy: matrix
        claims_policy: 'matrix'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
        # continuwuity always asks for openid and is configured
        # (src/matrix/static/continuwuity.toml) to add profile+email; the
        # claims those scopes grant reach it via the claims_policy above.
        scopes:
          - openid
          - profile
          - email
        redirect_uris:
          # Fixed path, see https://continuwuity.org/guides/oidc.html
          - https://matrix.{{ env "CONFIG_EXTRA_DOMAIN" }}/_continuwuity/oidc/complete

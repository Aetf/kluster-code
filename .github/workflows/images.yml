# Build (PRs) and publish (pushes to main) the self-maintained images in
# docker/. Each image is a `docker/<name>.{conf,Containerfile}` pair: the conf
# is fed to the build wholesale as --build-arg-file, and its <NAME>_VERSION
# entry is the published ghcr tag.
#
# Version bumps arrive as PRs on the conf: renovate raises them for pins
# carrying a `# renovate:` hint (the regex manager in renovate.json5), the
# rest are hand-edited. noop-automerge merges them once the pulumi preview
# proves a zero diff, this workflow publishes the new ghcr tag, and renovate's
# Pulumi.dev.yaml image manager then opens the deploy PR for human eyes. The
# cnpg images keep their manual `just docker-*` flow (heavy builds, composite
# tags).
name: Images

on:
  push:
    branches: [main]
    paths:
      - 'docker/emailproxy.*'
      - 'docker/golinks.*'
      - 'docker/gha-runner.*'
      - '.github/workflows/images.yml'
  pull_request:
    paths:
      - 'docker/emailproxy.*'
      - 'docker/golinks.*'
      - 'docker/gha-runner.*'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Renovate rebases push in quick succession; don't stack stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name: [emailproxy, golinks, gha-runner]
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        run: |
          set -a; source 'docker/${{ matrix.name }}.conf'; set +a
          var="$(echo '${{ matrix.name }}' | tr 'a-z-' 'A-Z_')_VERSION"
          echo "VERSION=${!var:?no version in docker/${{ matrix.name }}.conf}" >> "$GITHUB_ENV"
      - name: Build
        uses: redhat-actions/buildah-build@v3
        with:
          # The runner's own buildah is too old for Containerfile heredocs.
          # The action runs this image against the host podman's storage, so
          # the publish step below still finds the result.
          buildah-image: quay.io/buildah/stable
          image: ${{ matrix.name }}
          tags: ${{ env.VERSION }}
          containerfiles: docker/${{ matrix.name }}.Containerfile
          extra-args: --build-arg-file=docker/${{ matrix.name }}.conf
          # ghcr only reads the source annotation off OCI manifests; a docker
          # manifest drops it and the package loses its repository link.
          oci: true
          annotations: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ matrix.name }}
          tags: ${{ env.VERSION }}
          registry: ghcr.io/aetf
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

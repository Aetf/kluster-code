redactions = ["*_PASSPHRASE", "PULUMI_BACKEND_URL"]

[tools]
gemini-cli = "latest"
node = "latest"
pulumi = "latest"

[env]
PULUMI_K8S_SUPPRESS_HELM_HOOK_WARNINGS = "1"
PULUMI_CONFIG_PASSPHRASE = """
{%- set secret_file = [config_root, '.pulumi.secret'] | join_path -%}
{%- if secret_file is file -%}
{{- read_file(path=secret_file) -}}
{%- else -%}
{{-
exec(
    command="secret-tool lookup xdg:service pulumi",
    cache_key="PULUMI_CONFIG_PASSPHRASE",
    cache_duration="1d"
)
-}}
{%- endif -%}
"""
# DIY postgres state backend. Generated by deploy/state-backend/init.sh.
# Contains the DB password, so it lives in the git-ignored .pulumi.backend
# file (mirrors .pulumi.secret) and is redacted above.
PULUMI_BACKEND_URL = """
{%- set backend_file = [config_root, '.pulumi.backend'] | join_path -%}
{%- if backend_file is file -%}
{{- read_file(path=backend_file) | trim -}}
{%- else -%}
{{-
exec(
    command="secret-tool lookup xdg:service pulumi-backend",
    cache_key="PULUMI_BACKEND_URL",
    cache_duration="1d"
)
-}}
{%- endif -%}
"""

[tasks."state-db:init"]
description = "Generate .env, TLS certs and .pulumi.backend for the state backend (idempotent)"
run = "deploy/state-backend/init.sh"

[tasks."state-db:up"]
description = "Bring up the Pulumi state backend Postgres container"
depends = ["state-db:init"]
run = "podman compose -f deploy/state-backend/compose.yaml up -d"

[tasks."state-db:down"]
description = "Stop the Pulumi state backend Postgres container"
run = "podman compose -f deploy/state-backend/compose.yaml down"

# Pulumi DIY state backend for kluster-code.
#
# This is a BOOTSTRAP DEPENDENCY of the Pulumi project, not something Pulumi
# manages (that would be a chicken-and-egg: Pulumi needs this store to run).
# Its definition lives in-repo so the project is self-contained: on a fresh
# host, `mise run state-db:up` (which runs state-db:init first) is enough.
#
# Bring this up BEFORE any `pulumi` command. See README.md.
name: kluster-state-backend

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD (git-ignored, generated by init.sh)
    env_file: .env
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
    ports:
      # Bind ONLY to the LAN and ZeroTier addresses, never 0.0.0.0.
      # The host firewall further restricts these (see README.md).
      - "192.168.80.238:5432:5432"   # LAN (enp7s0)
      - "10.144.180.10:5432:5432"    # ZeroTier (ztqu3dzpfj)
    volumes:
      - pulumi_state_data:/var/lib/postgresql/data
      - ./certs:/certs:ro
    restart: unless-stopped
    shm_size: 128mb

volumes:
  pulumi_state_data:

# Helm values for the teahouse self-hosted runner scale set (ARC
# gha-runner-scale-set chart), installed as release `kluster-runner-set` in
# namespace `arc-runners`:
#
#   helm upgrade --install kluster-runner-set -n arc-runners \
#     oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
#     --version 0.14.2 -f docker/gha-runner-values.yaml
#
# The runner image is built from gha-runner.Containerfile.
githubConfigUrl: https://github.com/Aetf/teahouse
githubConfigSecret: pre-defined-secret

# The cluster's only capable node is the control-plane box (24 cores, 31 GB) and
# it also runs etcd. Unbounded runners starve etcd hard enough that
# kube-controller-manager loses its lease and k3s exits, taking the API server
# with it. Three things together keep the control plane alive: concurrency,
# per-pod cpu/memory limits (cargo's job count is capped to match the CPU
# limit so a build does not thrash inside its own cgroup), and keeping the
# runner's disk writes off the root nvme -- see the `work` volume below. The
# first two alone were not enough: two runners writing ~100 MB/s of image
# layers and cargo targets to the nvme pushed etcd fdatasync into the seconds.
maxRunners: 2

template:
  spec:
    # The other node is a small VPS that cannot carry a rust build; without a
    # selector a runner occasionally lands there and the job just crawls.
    nodeSelector:
      kubernetes.io/hostname: aetf-arch-homelab
    # A user namespace of the pod's own is what lets podman run at all without
    # a privileged pod: it makes `procMount: Unmasked` admissible (the API
    # server rejects Unmasked when hostUsers is true), and Unmasked is required
    # because containerd's masked /proc paths are locked mounts, which make the
    # kernel refuse the nested procfs mount every podman container needs.
    # Container uid 0 below maps to an unprivileged host uid, so the caps this
    # pod holds are confined to that namespace.
    hostUsers: false
    containers:
      - name: runner
        image: ghcr.io/aetf/gha-runner:2.337.0
        imagePullPolicy: Always
        command: ["/home/runner/run.sh"]
        env:
          - name: CARGO_BUILD_JOBS
            value: "6"
          # ARC registers runners through run.sh --jitconfig, which has no root
          # check, but config.sh does; set this so a fallback to that path does
          # not fail on the uid.
          - name: RUNNER_ALLOW_RUNASROOT
            value: "1"
        resources:
          requests:
            cpu: "2"
            memory: 2Gi
          limits:
            cpu: "6"
            memory: 8Gi
        securityContext:
          # Rootful podman inside the pod's user namespace. SYS_ADMIN is for
          # the mount and namespace work podman does per container; the network
          # caps are for CNI's bridge and portmap plugins.
          runAsUser: 0
          procMount: Unmasked
          capabilities:
            add: ["SYS_ADMIN", "NET_ADMIN", "NET_RAW", "MKNOD", "SYS_CHROOT"]
        volumeMounts:
          # Every place a job writes in bulk goes to the scratch volume, so
          # that nothing lands in the container rootfs on the node's root
          # disk: the checkout with its cargo target; podman's image store
          # (its overlay driver refuses to stack on the container's own
          # overlayfs rootfs anyway); /var/tmp, where buildah keeps
          # `--mount=type=cache` directories (the image build's cargo target
          # lives there, not in the store); /tmp for the rest of podman's
          # scratch; and root's home, where each job installs its toolchain
          # (~2 GB of rustup and mise per run). ARC mounts a `work` emptyDir
          # at _work unless the template names a volume `work` itself, which
          # is why the volume carries that name.
          - mountPath: /home/runner/_work
            name: work
            subPath: work
          - mountPath: /var/lib/containers
            name: work
            subPath: containers
          - mountPath: /var/tmp
            name: work
            subPath: var-tmp
          - mountPath: /tmp
            name: work
            subPath: tmp
          - mountPath: /root
            name: work
            subPath: home
    volumes:
      # A per-pod PV on the local-path-scratch class (kluster-code
      # src/local-path), a zfs dataset on the HDD pool rather than the nvme
      # that etcd lives on. Created and torn down with the pod. local-path
      # enforces no size: the request is what one job is expected to need and
      # the dataset's quota is the actual bound.
      - name: work
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              storageClassName: local-path-scratch
              resources:
                requests:
                  storage: 20Gi
